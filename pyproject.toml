# Dependency-analysis configuration for perc-eval.

[tool.deptry]
requirements_files = ["requirements.txt"]
extend_exclude = [
    "src/adversarial/black_box/defenisve_model\\.py",
]

# Packages and flat modules implemented by this repository.
known_first_party = [
    "src",
    "adversarial",
    "datasets",
    "model",
    "utils",
    "process",
    "bootstrap_checkpoint",
    "advanced_survey_stats",
    "validate_frqa",
    "metric_collection",
    "ci_analysis",
]

# Distribution names do not always match their import names.
[tool.deptry.package_module_name_map]
"scikit-image" = "skimage"
"POT" = "ot"
"torch-dct" = "torch_dct"
"pytorch-colors" = "pytorch_colors"
"DISTS-pytorch" = "DISTS_pytorch"
"IQA-pytorch" = "IQA_pytorch"
"diff-jpeg" = "diff_jpeg"

# These packages are deliberately pinned as runtime dependencies of packages
# used by the repository. They are not imported directly by perc-eval itself.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "huggingface-hub",  # PyIQA/Transformers runtime dependency
    "accelerate",       # PyIQA/Transformers runtime dependency
    "open-clip-torch",  # PyIQA model dependency
    "gdown",            # PyIQA model-weight download dependency
    "requests",         # pinned to satisfy torchattacks 3.5.1
]
